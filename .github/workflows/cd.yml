name: HelaCare Container Delivery

# Manual on purpose: configure deployment variables first, then run this workflow
# from the GitHub Actions tab when you are ready to publish images to GHCR.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/helacare-api:latest

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000/api/v1' }}
          tags: ghcr.io/${{ github.repository_owner }}/helacare-web:latest
