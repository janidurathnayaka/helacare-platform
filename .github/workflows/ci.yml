name: HelaCare CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install ".[dev]"

      - name: Run Ruff
        run: ruff check app tests alembic

      - name: Import API application
        run: python -c "from app.main import app; print(app.title)"

      - name: Run API tests
        run: pytest -q

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build Web application
        run: npm run build

  containers:
    name: Container build and security report
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --pull --no-cache --provenance=false -t helacare-api:ci ./apps/api

      - name: Build Web image
        run: docker build --pull --no-cache --provenance=false -t helacare-web:ci ./apps/web

      # Security findings are reported but do not fail the beginner portfolio pipeline.
      # This avoids red CI solely because a base image has a newly disclosed CVE.
      - name: Scan API image (informational)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helacare-api:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          skip-files: "**/pip/_vendor/bom.cdx.json"

      - name: Scan Web image (informational)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helacare-web:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
